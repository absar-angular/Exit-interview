<main style="padding: 32px; max-width: 700px;">
  <section *ngFor="let item of contentList" style="margin-bottom: 32px;">
    <h2 style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
      <mat-icon color="primary">verified_user</mat-icon>
      {{ item.heading }}
    </h2>
    <p style="margin: 0;">{{ item.paragraph }}</p>
  </section>
  <button mat-raised-button color="accent" style="margin-top: 16px;" routerLink="/register">Register</button>
</main>
